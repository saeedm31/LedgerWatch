<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="936" viewBox="0 0 1600 936" role="img" aria-labelledby="t d" fill="#13262A"><title id="t">Where LedgerWatch runs</title><desc id="d">Production path on AWS in the EU: single sign-on at a load balancer, one ECS Fargate task with the app and two read-only MCP servers, Claude on Amazon Bedrock, Snowflake fed from SAP, deploys from GitHub Actions.</desc><defs><marker id="head" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#5E6B6E"/></marker></defs><style>text{font-family:Inter, 'Segoe UI', Helvetica, Arial, sans-serif}.h{font-family:'Space Grotesk', Inter, 'Segoe UI', Helvetica, Arial, sans-serif}</style><rect width="1600" height="936" fill="#F6F5F1"/><text x="64" y="98" font-size="40" class="h" font-weight="700">Where it runs</text>
<text x="64" y="148" font-size="18" fill="#3F4D50">The production path: the data stays in the company&#x27;s Snowflake and AWS account, and Claude runs on Amazon</text>
<text x="64" y="176" font-size="18" fill="#3F4D50">Bedrock in the EU. No API keys in code; deploys use short-lived credentials.</text>
