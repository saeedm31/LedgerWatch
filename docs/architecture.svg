<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="t d" fill="#13262A"><title id="t">How LedgerWatch works</title><desc id="d">SAP journal entries flow to Snowflake, are scored by audit tests and ML models, the riskiest are investigated by a Claude agent with read-only tools, and accountants decide. Decisions go to memory and a gated retrain.</desc><defs><marker id="head" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#5E6B6E"/></marker></defs><style>text{font-family:Inter, 'Segoe UI', Helvetica, Arial, sans-serif}.h{font-family:'Space Grotesk', Inter, 'Segoe UI', Helvetica, Arial, sans-serif}</style><rect width="1600" height="880" fill="#F6F5F1"/><text x="64" y="98" font-size="40" class="h" font-weight="700">How LedgerWatch works</text>
<text x="64" y="148" font-size="18" fill="#3F4D50">Every journal entry of the month-end close is checked. Machine learning finds the risky few, an AI agent</text>
<text x="64" y="176" font-size="18" fill="#3F4D50">investigates them with read-only tools, and accountants make every decision.</text>
<rect x="956.5" y="64.5" width="95" height="35" rx="18" fill="#E3EAEC" stroke="#9FB3B8"/>
<text x="1004" y="87" font-size="14" font-weight="600" fill="#23414A" text-anchor="middle">Data</text>
<rect x="1064.5" y="64.5" width="159" height="35" rx="18" fill="#D6EEEB" stroke="#5FA39E"/>
<text x="1144" y="87" font-size="14" font-weight="600" fill="#0B4F52" text-anchor="middle">Machine learning</text>
<rect x="1236.5" y="64.5" width="127" height="35" rx="18" fill="#FCEBD0" stroke="#DDA04A"/>
<text x="1300" y="87" font-size="14" font-weight="600" fill="#6E4300" text-anchor="middle">AI (Claude)</text>
<rect x="1376.5" y="64.5" width="159" height="35" rx="18" fill="#ECE6F7" stroke="#9C88D2"/>
<text x="1456" y="87" font-size="14" font-weight="600" fill="#45307A" text-anchor="middle">People &amp; memory</text>
<line x1="288" y1="360" x2="372" y2="360" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="600" y1="360" x2="684" y2="360" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="912" y1="360" x2="996" y2="360" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="1224" y1="360" x2="1308" y2="360" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="1075" y1="456" x2="1075" y2="548" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="1149" y1="552" x2="1149" y2="460" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="1424" y1="456" x2="1424" y2="548" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="800" y1="552" x2="800" y2="460" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<line x1="1312" y1="644" x2="1228" y2="644" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#head)"/>
<line x1="1424" y1="736" x2="1424" y2="784" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round"/>
<line x1="1424" y1="784" x2="800" y2="784" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round"/>
<line x1="800" y1="784" x2="800" y2="740" stroke="#5E6B6E" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<text x="64" y="244" font-size="12" font-weight="600" fill="#4E5B5E" letter-spacing="1.4">1 · SOURCE</text>
<text x="376" y="244" font-size="12" font-weight="600" fill="#4E5B5E" letter-spacing="1.4">2 · DATA PLATFORM</text>
<text x="688" y="244" font-size="12" font-weight="600" fill="#4E5B5E" letter-spacing="1.4">3 · FIND (ML)</text>
<text x="1000" y="244" font-size="12" font-weight="600" fill="#4E5B5E" letter-spacing="1.4">4 · INVESTIGATE (AI)</text>
<text x="1312" y="244" font-size="12" font-weight="600" fill="#4E5B5E" letter-spacing="1.4">5 · DECIDE (PEOPLE)</text>
<rect x="64.5" y="264.5" width="223" height="191" rx="14" fill="#E3EAEC" stroke="#9FB3B8"/>
<g transform="translate(164,289)" fill="none" stroke="#23414A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
<text x="176" y="337" font-size="18" class="h" font-weight="700" fill="#23414A" text-anchor="middle">SAP S/4HANA</text>
<text x="176" y="359" font-size="15" text-anchor="middle">Journal entries</text>
<text x="176" y="381" font-size="15" text-anchor="middle">(ACDOCA, BKPF)</text>
<text x="176" y="403" font-size="15" text-anchor="middle">User and supplier</text>
<text x="176" y="425" font-size="15" text-anchor="middle">master data</text>
<rect x="376.5" y="264.5" width="223" height="191" rx="14" fill="#E3EAEC" stroke="#9FB3B8"/>
<g transform="translate(476,289)" fill="none" stroke="#23414A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></g>
<text x="488" y="337" font-size="18" class="h" font-weight="700" fill="#23414A" text-anchor="middle">Snowflake</text>
<text x="488" y="359" font-size="15" text-anchor="middle">A copy of the ledger</text>
<text x="488" y="381" font-size="15" text-anchor="middle">for analytics</text>
<text x="488" y="403" font-size="15" text-anchor="middle">LedgerWatch role:</text>
<text x="488" y="425" font-size="15" text-anchor="middle">SELECT only</text>
<rect x="688.5" y="264.5" width="223" height="191" rx="14" fill="#D6EEEB" stroke="#5FA39E"/>
<g transform="translate(788,289)" fill="none" stroke="#0B4F52" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20M5 20V11M10 20V5M15 20v-7M20 20V8"/></g>
<text x="800" y="337" font-size="18" class="h" font-weight="700" fill="#0B4F52" text-anchor="middle">Risk scoring</text>
<text x="800" y="359" font-size="15" text-anchor="middle">12 audit tests</text>
<text x="800" y="381" font-size="15" text-anchor="middle">+ 4 trained ML models</text>
<text x="800" y="403" font-size="15" text-anchor="middle">The riskiest few</text>
<text x="800" y="425" font-size="15" text-anchor="middle">go to review</text>
<rect x="1000.5" y="264.5" width="223" height="191" rx="14" fill="#FCEBD0" stroke="#DDA04A"/>
<g transform="translate(1100,289)" fill="none" stroke="#6E4300" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></g>
<text x="1112" y="337" font-size="18" class="h" font-weight="700" fill="#6E4300" text-anchor="middle">AI investigation</text>
<text x="1112" y="359" font-size="15" text-anchor="middle">Claude checks each</text>
<text x="1112" y="381" font-size="15" text-anchor="middle">flag with read-only</text>
<text x="1112" y="403" font-size="15" text-anchor="middle">tools and writes a</text>
<text x="1112" y="425" font-size="15" text-anchor="middle">note with evidence</text>
<rect x="1312.5" y="264.5" width="223" height="191" rx="14" fill="#ECE6F7" stroke="#9C88D2"/>
<g transform="translate(1412,289)" fill="none" stroke="#45307A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"/><path d="M16 11l2 2 4-4"/></g>
<text x="1424" y="337" font-size="18" class="h" font-weight="700" fill="#45307A" text-anchor="middle">Accountants</text>
<text x="1424" y="359" font-size="15" text-anchor="middle">Mark each flag:</text>
<text x="1424" y="381" font-size="15" text-anchor="middle">issue, fine, or</text>
<text x="1424" y="403" font-size="15" text-anchor="middle">ask the preparer.</text>
<text x="1424" y="425" font-size="15" text-anchor="middle">They decide, not AI.</text>
<rect x="64.5" y="552.5" width="535" height="183" rx="14" fill="#FFFFFF" stroke="#C9C4B6"/>
<g transform="translate(92,573)" fill="none" stroke="#13262A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></g>
<text x="92" y="621" font-size="18" class="h" font-weight="700">Built-in control</text>
<text x="92" y="643" font-size="15">The ledger is read-only. The AI has no tool that writes.</text>
<text x="92" y="665" font-size="15">Every number in an AI note is checked against the data.</text>
<text x="92" y="687" font-size="15">The AI can never clear a control test: a person decides.</text>
<text x="92" y="709" font-size="15">Every step is kept in a tamper-evident audit log.</text>
<rect x="688.5" y="552.5" width="223" height="183" rx="14" fill="#D6EEEB" stroke="#5FA39E"/>
<g transform="translate(788,573)" fill="none" stroke="#0B4F52" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4"/></g>
<text x="800" y="621" font-size="18" class="h" font-weight="700" fill="#0B4F52" text-anchor="middle">Retrain safely</text>
<text x="800" y="643" font-size="15" text-anchor="middle">A new model version</text>
<text x="800" y="665" font-size="15" text-anchor="middle">goes live only if it</text>
<text x="800" y="687" font-size="15" text-anchor="middle">passes the quality</text>
<text x="800" y="709" font-size="15" text-anchor="middle">gates and is no worse</text>
<rect x="1000.5" y="552.5" width="223" height="183" rx="14" fill="#FCEBD0" stroke="#DDA04A"/>
<g transform="translate(1100,573)" fill="none" stroke="#6E4300" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></g>
<text x="1112" y="621" font-size="18" class="h" font-weight="700" fill="#6E4300" text-anchor="middle">Read-only tools</text>
<text x="1112" y="643" font-size="15" text-anchor="middle">MCP servers:</text>
<text x="1112" y="665" font-size="15" text-anchor="middle">ledger lookups and</text>
<text x="1112" y="687" font-size="15" text-anchor="middle">a casebook of</text>
<text x="1112" y="709" font-size="15" text-anchor="middle">past decisions</text>
<rect x="1312.5" y="552.5" width="223" height="183" rx="14" fill="#ECE6F7" stroke="#9C88D2"/>
<g transform="translate(1412,573)" fill="none" stroke="#45307A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></g>
<text x="1424" y="621" font-size="18" class="h" font-weight="700" fill="#45307A" text-anchor="middle">Memory</text>
<text x="1424" y="643" font-size="15" text-anchor="middle">Decisions and known</text>
<text x="1424" y="665" font-size="15" text-anchor="middle">patterns, saved only</text>
<text x="1424" y="687" font-size="15" text-anchor="middle">when people choose.</text>
<text x="1424" y="709" font-size="15" text-anchor="middle">Four-eyes approval.</text>
<text x="332" y="344" font-size="13" fill="#4E5B5E" text-anchor="middle">replicated</text>
<text x="644" y="344" font-size="13" fill="#4E5B5E" text-anchor="middle">all entries</text>
<text x="956" y="344" font-size="13" fill="#4E5B5E" text-anchor="middle">top flags</text>
<text x="1268" y="344" font-size="13" fill="#4E5B5E" text-anchor="middle">AI note</text>
<text x="1087" y="508" font-size="13" fill="#4E5B5E">asks</text>
<text x="1161" y="508" font-size="13" fill="#4E5B5E">facts</text>
<text x="1436" y="508" font-size="13" fill="#4E5B5E">decisions</text>
<text x="812" y="508" font-size="13" fill="#4E5B5E">new version</text>
<text x="1268" y="628" font-size="13" fill="#4E5B5E" text-anchor="middle">past cases</text>
<text x="1112" y="808" font-size="13" fill="#4E5B5E" text-anchor="middle">decisions become training labels</text></svg>
