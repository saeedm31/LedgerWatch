[server]
headless = true

[browser]
gatherUsageStats = false

# Deep teal with an electric-yellow accent. Fonts are loaded by the CSS in app.py.
[theme]
base = "dark"
primaryColor = "#F5C542"
backgroundColor = "#08181C"
secondaryBackgroundColor = "#123038"
textColor = "#F2F4EE"
linkColor = "#4FD1C5"
borderColor = "#23474F"
showWidgetBorder = true
baseRadius = "0.75rem"
chartCategoricalColors = ["#F5C542", "#4FD1C5", "#5B8DEF", "#E8735A", "#B9A6F2", "#8FB3B5", "#6FCF97", "#F2A65A"]

[theme.sidebar]
backgroundColor = "#0B2026"
secondaryBackgroundColor = "#123038"
